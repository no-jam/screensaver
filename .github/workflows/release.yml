# Pushing a tag such as v1.0.0 builds Nojam.saver on a Mac and publishes it as a GitHub release.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Nojam.saver.zip \
            --title "Nojam screensaver $GITHUB_REF_NAME" \
            --notes "Unzip, then double-click Nojam.saver to install. This build is ad-hoc signed: the first time, right-click it and choose Open, or run: xattr -dr com.apple.quarantine Nojam.saver"
